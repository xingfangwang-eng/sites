    description: Local browser-based API endpoint

paths:
  /generate-prompt:
    get:
      summary: Generate optimized prompt template for multi-agent frameworks
      description: Generates a framework-specific prompt template based on the user's goal and selected agent framework style. Supports Hermes, CrewAI, and AutoGen patterns with Swarm Intelligence and Agent Orchestration strategies.
      parameters:
