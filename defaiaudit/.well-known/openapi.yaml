                    description: The generated prompt template optimized for the specified framework
                  framework:
                    type: string
                    description: The framework style used for generation
                  goal:
                    type: string
                    description: The original goal input
                  tokens_estimate:
                    type: integer
                    description: Estimated token count for the generated prompt
