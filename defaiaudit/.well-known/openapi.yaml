          in: query
          description: The objective or task description for the agent workflow
          required: true
          schema:
            type: string
            example: "Analyze market trends and generate investment recommendations"
        - name: style
          in: query
          description: The target agent framework style
          required: true
          schema:
            type: string
            enum:
              - hermes
              - crewai
              - autogen
